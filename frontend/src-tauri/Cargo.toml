[package]
name = "omnix"
version = "0.1.0"
description = "Omnix — Your Computer. One Intelligent Mind."
authors = ["Omnix Team"]
license = "MIT"
repository = "https://github.com/rajat1103/Omnix"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "omnix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
