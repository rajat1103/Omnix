services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnix-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; data = json.loads(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode()); raise SystemExit(0 if data.get('status') == 'healthy' else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
